[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "redis>=5.0.0",
    "sqlalchemy>=2.1.8",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "hypothesis>=6.100.0",
    "mypy>=2.4.1",
    "pip-audit>=2.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.3.1",
    "ruff>=0.17.4",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B008",   # FastAPI Depends() in route signature
    "E501",   # Line length
    "RUF012", # Mutable class attributes in models
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",
    "BLE001",
    "RUF059",
    "F841",
]
"migrations/*" = [
    "F401",
    "E402",
]
"app/seed/__main__.py" = [
    "F841",
]
"app/main.py" = [
    "BLE001",
]
"app/auth/passwords.py" = [
    "BLE001",
    "S110",
]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
disallow_subclassing_any = false
ignore_missing_imports = true
